name: Deploy Frontend to Vercel

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend

      # vercel pull / vercel build menginjeksikan env dari Vercel dashboard.
      # Jika VITE_API_URL terisi di sana (secret/URL salah), axios baseURL jadi
      # prefix path → POST /{value}/api/... miss rewrite → 405 di SPA.
      # Paksa kosong = same-origin /api/* → vercel.json → Render.
      - name: Force empty VITE_API_URL (same-origin proxy)
        working-directory: ./frontend
        run: |
          set -euo pipefail
          for f in \
            .env \
            .env.local \
            .env.production \
            .env.production.local \
            .vercel/.env.production.local
          do
            if [ -f "$f" ]; then
              sed -i -E '/^VITE_API_URL=/d' "$f"
            fi
          done
          echo 'VITE_API_URL=' >> .env.production.local
          # Best-effort: hapus dari project Vercel agar pull berikutnya bersih
          vercel env rm VITE_API_URL production --yes --token="${{ secrets.VERCEL_TOKEN }}" || true

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend
        env:
          # Kosong = same-origin; path API sudah diawali /api (mis. /api/auth/login).
          # Jangan set ke "/api" — akan jadi double prefix /api/api/... → 404.
          VITE_API_URL: ''
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_MIDTRANS_CLIENT_KEY: ${{ secrets.VITE_MIDTRANS_CLIENT_KEY }}
          VITE_MIDTRANS_IS_PRODUCTION: ${{ vars.VITE_MIDTRANS_IS_PRODUCTION || 'false' }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        working-directory: ./frontend
