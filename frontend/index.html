<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UMKM POS</title>
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Kasir Toko Online untuk UMKM — Gratis, Gampang, Bisa dari HP" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="UMKM POS" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <script>
      (function() {
        try {
          const storage = localStorage.getItem('pos-theme-storage');
          if (storage) {
            const parsed = JSON.parse(storage);
            if (parsed && parsed.state && parsed.state.theme === 'dark') {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
