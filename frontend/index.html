    <script>
      (function() {
        try {
          const storage = localStorage.getItem('pos-theme-storage');
          if (storage) {
            const parsed = JSON.parse(storage);
            if (parsed && parsed.state && parsed.state.theme === 'dark') {
              document.documentElement.classList.add('dark');
            }
          }
        } catch (e) {}
      })();
